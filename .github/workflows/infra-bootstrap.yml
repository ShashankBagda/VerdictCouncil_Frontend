name: Infra Bootstrap (one-time provisioning)

# One-shot, manually-triggered provisioning of the DigitalOcean App Platform
# apps that the deploy workflows assume. Idempotent — if the app already
# exists, its UUID is captured and reused.
#
# What this provisions, per environment:
#   - DO App Platform app from `.do/app.<env>.yaml`
#   - Writes the resulting app UUID back to repo secrets:
#       DO_APP_ID_STAGING / DO_APP_ID_PRODUCTION
#   - Writes DIGITALOCEAN_ACCESS_TOKEN passthrough to repo secrets if needed
#
# Required GitHub Action secrets:
#   DIGITALOCEAN_ACCESS_TOKEN  — doctl token with apps:read+write
#   BOOTSTRAP_GH_PAT           — fine-grained PAT for this repo with
#                                "Secrets: read/write". Used only to write
#                                generated values back as repo secrets.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment to bootstrap.
        type: choice
        required: true
        options:
          - staging
          - production

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve env-specific names
        id: names
        run: |
          ENV="${{ inputs.environment }}"
          if [ "$ENV" = "production" ]; then
            APP_NAME="verdictcouncil-frontend-production"
            SPEC=".do/app.production.yaml"
            SECRET="DO_APP_ID_PRODUCTION"
          else
            APP_NAME="verdictcouncil-frontend-staging"
            SPEC=".do/app.staging.yaml"
            SECRET="DO_APP_ID_STAGING"
          fi
          {
            echo "app_name=$APP_NAME"
            echo "spec=$SPEC"
            echo "secret=$SECRET"
          } >> "$GITHUB_OUTPUT"

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Ensure App Platform app exists
        id: app
        run: |
          APP_NAME="${{ steps.names.outputs.app_name }}"
          # Look up by name (apps are unique per account by name).
          APP_ID=$(doctl apps list -o json | jq -r --arg n "$APP_NAME" '.[] | select(.spec.name == $n) | .id' | head -n1)
          if [ -z "$APP_ID" ]; then
            echo "Creating App Platform app $APP_NAME..."
            APP_ID=$(doctl apps create --spec "${{ steps.names.outputs.spec }}" --format ID --no-header --wait)
          else
            echo "App $APP_NAME already exists ($APP_ID); updating spec..."
            doctl apps update "$APP_ID" --spec "${{ steps.names.outputs.spec }}" --wait
          fi
          echo "id=$APP_ID" >> "$GITHUB_OUTPUT"

      - name: Write app UUID to repo secret
        env:
          GH_TOKEN: ${{ secrets.BOOTSTRAP_GH_PAT }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::BOOTSTRAP_GH_PAT not set; skipping secret write-back."
            echo "::warning::Manually set ${{ steps.names.outputs.secret }}=${{ steps.app.outputs.id }}"
            exit 0
          fi
          gh secret set "${{ steps.names.outputs.secret }}" --body "${{ steps.app.outputs.id }}"

      - name: Job summary
        run: |
          {
            echo "## Frontend bootstrap complete: ${{ inputs.environment }}"
            echo
            echo "| Resource | Value |"
            echo "|---|---|"
            echo "| App name | \`${{ steps.names.outputs.app_name }}\` |"
            echo "| App UUID | \`${{ steps.app.outputs.id }}\` |"
            echo "| Spec | \`${{ steps.names.outputs.spec }}\` |"
            echo
            echo "Push to \`development\` (staging) or \`main\` (production) to trigger a deploy."
          } >> "$GITHUB_STEP_SUMMARY"
