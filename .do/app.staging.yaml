# Declarative App Platform spec for the staging frontend.
# The web service runs an nginx-served SPA pulled from DOCR. Image rolls
# are driven by the Deploy workflow — `deploy_on_push` is disabled so the
# workflow remains the single source of truth for deployments.
name: verdictcouncil-frontend-staging
region: sgp
services:
  - name: web
    image:
      registry_type: DOCR
      repository: verdictcouncil-frontend
      tag: staging-latest
      deploy_on_push:
        enabled: false
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /
    routes:
      - path: /
